<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realms Spellbook</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="spell-grid">
        <button class="spell-slot" data-position="1-1">Select Spell</button>
        <button class="spell-slot" data-position="1-2">Select Spell</button>
        <button class="spell-slot" data-position="1-3">Select Spell</button>
        <button class="spell-slot" data-position="2-1">Select Spell</button>
        <button class="spell-slot" data-position="2-2">Select Spell</button>
        <button class="spell-slot" data-position="2-3">Select Spell</button>
        <button class="spell-slot" data-position="3-1">Select Spell</button>
        <button class="spell-slot" data-position="3-2">Select Spell</button>
        <button class="spell-slot" data-position="3-3">Select Spell</button>
        <button class="spell-slot" data-position="4-1">Select Spell</button>
        <button class="spell-slot" data-position="4-2">Select Spell</button>
        <button class="spell-slot" data-position="4-3">Select Spell</button>
        <button class="spell-slot" data-position="5-1">Select Spell</button>
        <button class="spell-slot" data-position="5-2">Select Spell</button>
        <button class="spell-slot" data-position="5-3">Select Spell</button>
        <button class="spell-slot middle-extra" data-position="6-2">Select Spell</button>
        <!-- Options textarea covering 6-1,6-2,7-1,7-2 -->
        <textarea id="spell-options" class="options-box" placeholder="Spell Options"></textarea>
        <!-- Clear button placed bottom-right (7-3) -->
        <button class="spell-slot clear-btn" data-position="7-3">Clear</button>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
