<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realms Spellbook</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Prevent flash of wrong styling until JS applies selection */
        .js-initial-hide { visibility: hidden; }
        /* Ensure your selected/non-selected styles still apply */
        /* Example: */
        .spell { /* ...existing styles... */ }
        .spell.selected { /* ...selected styles... */ }
        /* Highlight the first empty slot (column-first) by scaling it 8% larger
           than the other buttons. Keep a small transition and raise z-index
           so it visually pops without changing layout flow. */
        .spell-slot.first-empty {
            transform: scale(1.08);
            transform-origin: center;
            z-index: 2;
            transition: transform 140ms ease;
            /* Color halfway between the default gray (#888) and black (#000) */
            color: #444444;
        }
        /* Keyboard-only selected styling: keep stored `.selected` as black (defined in styles.css).
           `.kbd-selected` is applied by keyboard navigation and should be highlighted. */
        .spell-slot.kbd-selected {
            transform: scale(1.08);
            transform-origin: center;
            z-index: 2;
            transition: transform 140ms ease, color 120ms ease;
            color: var(--highlight-color); /* use site highlight color for keyboard selection */
            box-shadow: none; /* remove blue outline/shadow */
            outline: none; /* remove default focus outline */
        }

        /* Ensure keyboard-highlight overrides the first-empty gray color */
        .spell-slot.first-empty.kbd-selected {
            color: var(--highlight-color);
        }

        /* Keep background color matching original row colors */
        .spell-slot.selected[data-position^="1-"],
        .spell-slot.kbd-selected[data-position^="1-"],
        .spell-slot.selected[data-position^="3-"],
        .spell-slot.kbd-selected[data-position^="3-"],
        .spell-slot.selected[data-position^="5-"],
        .spell-slot.kbd-selected[data-position^="5-"] {
            background-color: white;
        }

        .spell-slot.selected[data-position^="2-"],
        .spell-slot.kbd-selected[data-position^="2-"],
        .spell-slot.selected[data-position^="4-"],
        .spell-slot.kbd-selected[data-position^="4-"],
        .spell-slot.selected[data-position^="6-"],
        .spell-slot.kbd-selected[data-position^="6-"],
        .spell-slot.selected.clear-btn,
        .spell-slot.kbd-selected.clear-btn {
            background-color: #f0f0f0; /* gray rows */
        }

        /* Remove default focus outline for selected items specifically */
        .spell-slot.selected:focus,
        .spell-slot.kbd-selected:focus {
            outline: none;
            box-shadow: none;
        }
    </style>

    <script>
        // Run as early as possible. This script will wait for DOMContentLoaded,
        // apply the "selected" class to matching spell elements based on
        // saved selection (localStorage 'selectedSpells' expected to be JSON array),
        // then reveal the page by removing the hide class.
        (function() {
            var storageKey = 'selectedSpells';
            function applySelection() {
                try {
                    var raw = localStorage.getItem(storageKey);
                    if (!raw) return;
                    var selected = JSON.parse(raw);
                    if (!Array.isArray(selected)) return;
                    // Convert to a Set for faster lookup
                    var selSet = {};
                    for (var i = 0; i < selected.length; i++) selSet[String(selected[i])] = true;
                    // Find elements with data-spell-id and add the 'selected' class
                    var nodes = document.querySelectorAll('[data-spell-id]');
                    for (var j = 0; j < nodes.length; j++) {
                        var el = nodes[j];
                        var id = el.getAttribute('data-spell-id');
                        if (id && selSet[id]) el.classList.add('selected');
                        else el.classList.remove('selected');
                    }
                } catch (e) {
                    // If anything goes wrong, don't block showing the page
                    console.error('applySelection error', e);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    applySelection();
                    document.body.classList.remove('js-initial-hide');
                }, { once: true });
            } else {
                // DOM already ready
                applySelection();
                document.body.classList.remove('js-initial-hide');
            }
        })();
    </script>
</head>

<body class="js-initial-hide">
    <nav class="top-nav">
        <a class="nav-btn" href="index.html">Spell List</a>
    </nav>
    <div class="spell-grid">
        <button class="spell-slot" data-position="1-1">Select Spell</button>
        <button class="spell-slot" data-position="1-2">Select Spell</button>
        <button class="spell-slot" data-position="1-3">Select Spell</button>
        <button class="spell-slot" data-position="2-1">Select Spell</button>
        <button class="spell-slot" data-position="2-2">Select Spell</button>
        <button class="spell-slot" data-position="2-3">Select Spell</button>
        <button class="spell-slot" data-position="3-1">Select Spell</button>
        <button class="spell-slot" data-position="3-2">Select Spell</button>
        <button class="spell-slot" data-position="3-3">Select Spell</button>
        <button class="spell-slot" data-position="4-1">Select Spell</button>
        <button class="spell-slot" data-position="4-2">Select Spell</button>
        <button class="spell-slot" data-position="4-3">Select Spell</button>
        <button class="spell-slot" data-position="5-1">Select Spell</button>
        <button class="spell-slot" data-position="5-2">Select Spell</button>
        <button class="spell-slot" data-position="5-3">Select Spell</button>
        <button class="spell-slot middle-extra" data-position="6-2">Select Spell</button>
        <!-- Options textarea covering 6-1,6-2,7-1,7-2 -->
        <textarea id="spell-options" class="options-box" placeholder="Spell Options"></textarea>
    <!-- Alchemy points label at row 7, column 3 (non-interactable) -->
    <div id="alchemy-points" class="spell-slot alchemy-label" data-position="7-3">Alchemy Points: 0</div>
    <!-- Clear button moved down to bottom-right (8-3) -->
    <button class="spell-slot clear-btn" data-position="8-3">Clear</button>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
