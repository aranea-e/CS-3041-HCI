<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realms Spellbook</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 1.5rem;
            background-color: #fff;
            color: #222;
        }

        /* Two-column layout for selection page: left = 33%, right = 67%.
           Use fixed percentages so columns keep consistent horizontal spacing
           even when content inside a column is hidden (e.g., via search).
           On narrow viewports stack the columns. */
        .selection-columns {
            display: grid;
            grid-template-columns: 33% 67%;
            gap: 1.25rem;
            align-items: start;
            width: 100%;
            box-sizing: border-box;
        }

        .left-col {
            width: 100%;
            min-width: 0;
        }

        .right-col {
            width: 100%;
            min-width: 0;
        }

        @media (max-width: 720px) {
            .selection-columns {
                grid-template-columns: 1fr;
            }
        }
        /* Simple toggle switch styles (Buydowns) */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { display: none; }
        .switch .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            border-radius: 20px;
            transition: background-color .15s ease;
        }
        .switch .slider:before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 2px;
            top: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            transition: transform .15s ease;
        }
        .switch input:checked + .slider {
            background-color: #18bca8;
        }
        .switch input:checked + .slider:before {
            transform: translateX(20px);
        }
        /* Ensure the label text aligns vertically with the switch */
        .buydowns-switch {
            display: inline-flex;
            align-items: center;
        }

        /* Position the Buydowns switch absolutely so only the switch moves
           (the label text remains in flow and stays right-aligned). We
           anchor the absolute positioning to the `.top-row` container so
           the switch can be placed at the same x-position as the
           Alternatives switch below. Adjust `right` if you want a nudge. */
        .top-row { position: relative; }
        .top-row .buydowns-switch { position: relative; }
        .top-row .buydowns-switch .switch {
            position: absolute;
            top: 50%;
            right: 6.25rem; /* adjust this value to fine-tune alignment */
            transform: translateY(-50%);
        }
        /* When present on body, suppress switch animations (used during initial restore) */
        .no-switch-anim .switch .slider,
        .no-switch-anim .switch .slider:before {
            transition: none !important;
        }

        #circles {
            max-width: 640px;
        }

        .circle-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .circle-btn {
            padding: 0.45rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fbfbfb;
            cursor: pointer;
            font-size: 0.95rem;
        }

        h2 {
            margin: 0.4rem 0;
            font-weight: 600;
            color: #333;
        }

        .notice {
            color: #666;
            font-size: 0.95rem;
        }
        #top-controls {
            display: flex;
            flex-direction: column; /* stack search above No Spell */
            gap: 0.5rem;
            align-items: stretch;
            margin-bottom: 0.75rem;
        }

        #search-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        /* Make No Spell button align to the left under the search bar */
        #top-controls .circle-btn {
            width: auto;
            align-self: flex-start;
        }
        /* Keyboard selection styling (match the green used for switches) */
        .kbd-selected {
            color: #18bca8 !important;
        }
        /* Ensure selected buttons still show usual button layout but with green text */
        .circle-btn.kbd-selected {
            color: #18bca8 !important;
        }
        /* When the switches' container has .kbd-selected, color the label text */
        .buydowns-switch.kbd-selected span,
        .alternatives-switch.kbd-selected span {
            color: #18bca8 !important;
        }
        /* Remove the browser focus outline/box-shadow for our interactive items
           so selection is shown only via the green color. We still keep elements
           keyboard-focusable for accessibility but suppress the default ring. */
        .circle-btn:focus,
        #search-input:focus,
        .buydowns-switch input:focus,
        .alternatives-switch input:focus {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a class="nav-btn" href="../index.html">Spell List</a>
    </nav>
    <div class="selection-columns">
        <div class="left-col">
            <div id="top-controls">
                <input id="search-input" type="search" placeholder="Search spells..." aria-label="Search spells" />
                <div class="top-row" style="display:flex; justify-content:space-between; align-items:center; gap:1rem;">
                    <button id="no-spell-btn" class="circle-btn">No Spell</button>
                    <div class="buydowns-switch">
                        <label class="switch">
                            <input id="buydowns-toggle" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                        <span style="margin-left:0.5rem; font-weight:600;">Buydowns</span>
                    </div>
                </div>
                <div class="special-row" style="margin-top:0.5rem; display:flex; justify-content:space-between; align-items:center;">
                    <div id="special-buttons" style="display:flex; gap:0.5rem;">
                        <button id="regional-btn" class="circle-btn">Regional</button>
                        <button id="alchemy-btn" class="circle-btn">Alchemy</button>
                    </div>
                    <div class="alternatives-switch buydowns-switch">
                        <label class="switch">
                            <input id="alternatives-toggle" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                        <span style="margin-left:0.5rem; font-weight:600;">Alternatives</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="right-col">
            <div id="circles"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('circles');

            // 1) Try to read position from URL query string: ?pos=...
            const params = new URLSearchParams(window.location.search);
            let selectedPosition = params.get('pos');

            // 2) Fallback to localStorage if URL param missing
            if (!selectedPosition) {
                try {
                    selectedPosition = localStorage.getItem('selectedPosition');
                } catch (e) {
                    selectedPosition = null;
                }
            }

            const noSpellBtn = document.getElementById('no-spell-btn');
            const regionalBtn = document.getElementById('regional-btn');
            const alchemyBtn = document.getElementById('alchemy-btn');

            if (!selectedPosition) {
                // hide the No Spell button when no position is available
                if (noSpellBtn) noSpellBtn.style.display = 'none';
                if (regionalBtn) regionalBtn.style.display = 'none';
                if (alchemyBtn) alchemyBtn.style.display = 'none';
                const p = document.createElement('p');
                p.className = 'notice';
                p.textContent = 'No position selected';
                container.appendChild(p);
                return;
            }

            // Expect format like "3-2". Extract the first number (circle index)
            const firstPart = selectedPosition.split('-')[0];
            const start = parseInt(firstPart, 10);

            // If a 1st-circle slot is selected, hide the top-row Buydowns switch
            // (do not affect the Alternatives switch which is a separate control).
            try {
                const topBuydowns = document.querySelector('.top-row .buydowns-switch');
                if (topBuydowns && start === 1) {
                    topBuydowns.style.display = 'none';
                }
            } catch (e) {
                // ignore
            }

            if (Number.isNaN(start) || start <= 0) {
                const p = document.createElement('p');
                p.className = 'notice';
                p.textContent = 'Invalid position value';
                container.appendChild(p);
                return;
            }

            // Helper to get English ordinal suffix (1st, 2nd, 3rd, 4th...)
            function ordinalSuffix(n) {
                const rem100 = n % 100;
                if (rem100 >= 11 && rem100 <= 13) return 'th';
                const rem10 = n % 10;
                if (rem10 === 1) return 'st';
                if (rem10 === 2) return 'nd';
                if (rem10 === 3) return 'rd';
                return 'th';
            }

            // Create headers from start down to 1 with ordinal suffixes
            // Map of circle number -> button labels
            const circleLabels = {
                1: [
                    'Cure Disease', 'Detect Magic', 'Disrupt Light', "Fighter’s Intuition",
                    'Gentle Repose', 'Ghost Blade', 'Heartiness', 'Identify', 'Immunity to Poison',
                    'Implement', 'Light', 'Mentor', 'Pas', 'Protect Item', 'Protection from Boulder',
                    'Repair Armor', 'Speak', 'Speak with Dead', 'Strange Brew', 'Transmute Weapon', 'Zombie Walk'
                ],
                2: [
                    'Aura of Protection', 'Death Watch', 'Deep Pockets', 'Disenchant', 'Dream',
                    'Enchant Weapon', 'Group Healing', 'Guidance', 'Heal Limb', 'Protect the Soul',
                    'Protection from Missile', 'Reanimate Limb', 'Repair Item', 'Ward: Undead'
                ],
                3: [
                    'Animate Lesser Undead', 'Beckon Corpse', 'Cantrip', 'Commune with Spirit', 'Disease Weapon',
                    'Enfeeble Being', 'Feign Death', 'Foretell', 'Fortune Tell', 'Merge', 'Precognition', 'Purity',
                    'Raise Dead', 'Skew Divination', 'Soul Bane'
                ],
                4: [
                    'Animal Companion', 'Animate Undead', 'Armored Cloak', 'Call the Soul', 'Circle of Protection',
                    'Combat Raise Dead', 'Create Poison', 'Death Wish', 'Disrupt', 'Divine Aid', 'Enchant Armor',
                    'Find the Path', 'Magic Missile', 'Mystic Forge', 'Séance', 'Shapeshifting'
                ],
                5: [
                    'Animate Undead General', 'Armor-Piercing Weapon', 'Circle of Healing', 'Familiar', 'Reforge',
                    'Regenerate the Soul', 'Regeneration', 'Resist Magic', 'Vision', 'Ward: Enchanted Beings'
                ],
                6: [
                    'Assassin’s Blade', 'Cry of Life', 'Embrace Death', 'Intervention', 'Lightning Bolt',
                    'Masterwork Hammer', 'Prophecy', 'Resist Death', 'Ritual of Banishment', 'Second Chance',
                    'Seed of Life', 'Transformation'
                ]
            };

            for (let i = start; i >= 1; i--) {
                const h = document.createElement('h2');
                const suffix = ordinalSuffix(i);
                h.textContent = `${i}${suffix} circle`;
                container.appendChild(h);

                const labels = circleLabels[i];
                if (labels && labels.length) {
                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'circle-buttons';

                    labels.forEach(label => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'circle-btn';
                        btn.textContent = label;
                        btnContainer.appendChild(btn);
                    });

                    container.appendChild(btnContainer);
                }
            }

            // Update Alchemy label based on selected circle (display a number in parens)
            // Mapping: circle 1->1, 2->2, 3->4, 4->6, 5->8, 6->12
            try {
                const alchemyMap = {1:1,2:2,3:4,4:6,5:8,6:12};
                if (alchemyBtn) {
                    const val = alchemyMap[start] || '';
                    alchemyBtn.textContent = val ? `Alchemy (${val})` : 'Alchemy';
                }
            } catch (e) {
                // ignore
            }

            // Search/filter: filter displayed .circle-btn elements inside the container
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                const applyFilter = () => {
                    const q = (searchInput.value || '').trim().toLowerCase();
                    const optionButtons = container.querySelectorAll('.circle-btn');
                    // Also include the special buttons (Regional/Alchemy) which live
                    // outside the circles container so they can be filtered too.
                    const specialButtons = document.querySelectorAll('#special-buttons .circle-btn');

                    function filterButton(b) {
                        const text = (b.textContent || '').toLowerCase();
                        if (!q || text.includes(q)) {
                            b.style.display = '';
                        } else {
                            b.style.display = 'none';
                        }
                    }

                    optionButtons.forEach(filterButton);
                    specialButtons.forEach(filterButton);
                };

                searchInput.addEventListener('input', applyFilter);
                // initial pass
                applyFilter();
                    // Initialize Buydowns toggle (default OFF -> hide all but highest)
                try {
                    const buydownsToggle = document.getElementById('buydowns-toggle');
                    function updateBuydownsView() {
                        const showOnlyHighest = !buydownsToggle.checked; // checked = ON (show all)
                        const headers = container.querySelectorAll('h2');
                        headers.forEach((h, idx) => {
                            const btns = h.nextElementSibling && h.nextElementSibling.classList && h.nextElementSibling.classList.contains('circle-buttons') ? h.nextElementSibling : null;
                            if (idx === 0) {
                                h.style.display = '';
                                if (btns) btns.style.display = '';
                            } else {
                                if (showOnlyHighest) {
                                    h.style.display = 'none';
                                    if (btns) btns.style.display = 'none';
                                } else {
                                    h.style.display = '';
                                    if (btns) btns.style.display = '';
                                }
                            }
                        });
                    }
                    if (buydownsToggle) {
                        // load persisted value (default OFF) without animating the switch
                        try {
                            const stored = localStorage.getItem('buydowns');
                            document.body.classList.add('no-switch-anim');
                            buydownsToggle.checked = stored === null ? false : (stored === 'true');
                        } catch (e) {
                            buydownsToggle.checked = false;
                        }
                        // remove the suppression on the next frame so future toggles animate
                        requestAnimationFrame(() => document.body.classList.remove('no-switch-anim'));

                        buydownsToggle.addEventListener('change', () => {
                            try { localStorage.setItem('buydowns', String(buydownsToggle.checked)); } catch (e) {}
                            updateBuydownsView();
                        });
                        // apply initial state
                        updateBuydownsView();
                    }
                } catch (e) {
                    // ignore
                }
                // Initialize Alternatives toggle (default OFF -> hide Regional/Alchemy)
                try {
                    const alternativesToggle = document.getElementById('alternatives-toggle');
                    const specialButtonsContainer = document.getElementById('special-buttons');
                    function updateAlternativesView() {
                        const show = !!(alternativesToggle && alternativesToggle.checked);
                        if (specialButtonsContainer) {
                            // Use visibility:hidden so the container keeps its layout
                            // space (prevents the Alternatives switch from moving
                            // vertically when the special buttons are hidden).
                            specialButtonsContainer.style.visibility = show ? '' : 'hidden';
                            // Also disable pointer events when hidden so buttons
                            // aren't focusable or clickable.
                            specialButtonsContainer.style.pointerEvents = show ? '' : 'none';
                            specialButtonsContainer.setAttribute('aria-hidden', show ? 'false' : 'true');
                        }
                    }
                    if (alternativesToggle) {
                        // load persisted value (default OFF)
                        try {
                            const storedAlt = localStorage.getItem('alternatives');
                            alternativesToggle.checked = storedAlt === null ? false : (storedAlt === 'true');
                        } catch (e) {
                            alternativesToggle.checked = false;
                        }
                        alternativesToggle.addEventListener('change', () => {
                            try { localStorage.setItem('alternatives', String(alternativesToggle.checked)); } catch (e) {}
                            updateAlternativesView();
                        });
                        updateAlternativesView();
                    }
                } catch (e) {
                    // ignore
                }
            }

                    // --- Keyboard navigation for left column (3x3 wrapped grid) ---
                    (function() {
                        const searchInput = document.getElementById('search-input');
                        const noSpellBtn = document.getElementById('no-spell-btn');
                        const topBuydowns = document.querySelector('.top-row .buydowns-switch');
                        const buydownsToggle = document.getElementById('buydowns-toggle');
                        const regionalBtn = document.getElementById('regional-btn');
                        const alchemyBtn = document.getElementById('alchemy-btn');
                        const alternativesContainer = document.querySelector('.alternatives-switch');
                        const alternativesToggle = document.getElementById('alternatives-toggle');

                        // current grid position (row, col). Start at (0,0)
                        let cur = {r:0, c:0};
                        // last movement direction used to resolve (1,1) behavior
                        let lastDir = null; // 'vertical' or 'horizontal'
                        // track when focus has moved into the right-column spell list
                        let inRightList = false;
                        // remember previous grid coord so we can return from right list
                        let prevGridCur = {r:0,c:0};
                        // the currently-selected element in the right list
                        let rightSelectedEl = null;
                        // remember the last row index user was in while in right list
                        // (used to restore that row when re-entering the right list)
                        let rememberedRightRow = null;

                        function mod3(n) { return ((n % 3) + 3) % 3; }

                        function normalizeCoord(prev, attempted, dir) {
                            const r = mod3(attempted.r);
                            const c = mod3(attempted.c);

                            // Row 0: anything on row 0 maps to (0,0) (selection bar)
                            if (r === 0) return {r:0,c:0};

                            // Row 1 rules
                            if (r === 1) {
                                if (c === 0) return {r:1,c:0}; // No Spell
                                if (c === 1) {
                                    // (1,1) special handling
                                    if (dir === 'vertical') return {r:1,c:0};
                                    // horizontal: skip cell. When moving from No Spell (c===0)
                                    // to the right, normally we skip to Buydowns (c===2). But
                                    // if the Buydowns control is not present/visible we should
                                    // remain on No Spell.
                                    if (prev && prev.c === 0) {
                                        if (!topBuydowns || topBuydowns.style.display === 'none') return {r:1,c:0};
                                        return {r:1,c:2};
                                    }
                                    if (prev && prev.c === 2) return {r:1,c:0};
                                    return {r:1,c:0};
                                }
                                if (c === 2) {
                                    // Buydowns switch may not be present
                                    if (!topBuydowns || topBuydowns.style.display === 'none') return {r:1,c:0};
                                    return {r:1,c:2};
                                }
                            }

                            // Row 2 rules
                            if (r === 2) {
                                // If Alternatives is turned off, regional & alchemy redirect to alternatives
                                const altOn = !!(alternativesToggle && alternativesToggle.checked);
                                if (c === 2) return {r:2,c:2};
                                if (!altOn) return {r:2,c:2};
                                // altOn true: map normally
                                if (c === 0) return {r:2,c:0};
                                if (c === 1) return {r:2,c:1};
                            }

                            // fallback
                            return {r:0,c:0};
                        }

                        function elementForCoord(coord) {
                            const {r,c} = coord;
                            if (r === 0) return searchInput;
                            if (r === 1) {
                                if (c === 0) return noSpellBtn;
                                if (c === 2) return topBuydowns || noSpellBtn;
                                // c===1 should not be reached because normalizeCoord handles it
                                return noSpellBtn;
                            }
                            if (r === 2) {
                                if (c === 2) return alternativesContainer;
                                if (c === 0) return regionalBtn;
                                if (c === 1) return alchemyBtn;
                            }
                            return null;
                        }

                        function clearSelectionVisuals() {
                            document.querySelectorAll('.kbd-selected').forEach(el => el.classList.remove('kbd-selected'));
                        }

                        function applySelectionVisual(el) {
                            if (!el) return;
                            // For switch containers, add class to container so label spans get colored
                            if (el.classList && (el.classList.contains('buydowns-switch') || el.classList.contains('alternatives-switch'))) {
                                el.classList.add('kbd-selected');
                                // also visually focus the inner input (but don't open keyboard focus for input)
                            } else if (el.tagName === 'INPUT') {
                                el.classList.add('kbd-selected');
                            } else if (el.classList && el.classList.contains('circle-btn')) {
                                el.classList.add('kbd-selected');
                            }
                        }

                        function focusCoord(coord) {
                            const el = elementForCoord(coord);
                            if (!el) return;
                            clearSelectionVisuals();
                            applySelectionVisual(el);
                            // Ensure the newly focused element is visible (switches included)
                            try {
                                const header = document.querySelector('.top-nav');
                                const headerH = header ? header.getBoundingClientRect().height : 0;
                                const rect = el.getBoundingClientRect();
                                const padding = 8; // extra space below header
                                const offset = Math.max(padding, headerH + padding);
                                // If the element would be hidden behind the header or offscreen,
                                // scroll so its top sits just below the header (with padding).
                                const elTop = rect.top;
                                const elBottom = rect.bottom;
                                const viewportH = window.innerHeight || document.documentElement.clientHeight;
                                if (elTop < offset || elBottom > viewportH - padding) {
                                    const desiredTop = Math.max(0, window.scrollY + rect.top - offset);
                                    window.scrollTo({ top: desiredTop, left: 0, behavior: 'auto' });
                                }
                            } catch (e) {}
                            // Blur any previously focused element so its native focus styling
                            // (blue outline) is removed immediately when we change selection.
                            try {
                                const prev = document.activeElement;
                                if (prev && prev !== document.body && typeof prev.blur === 'function') prev.blur();
                            } catch (e) {}
                            // Focus where sensible: inputs and buttons
                            try {
                                if (el.tagName === 'INPUT') el.focus();
                                else if (el.classList && el.classList.contains('circle-btn')) el.focus();
                                else if (el.classList && (el.classList.contains('buydowns-switch') || el.classList.contains('alternatives-switch'))) {
                                    // focus the internal checkbox for aria/focus
                                    const input = el.querySelector('input');
                                    if (input) input.focus();
                                }
                            } catch (e) {}
                        }

                        // Initialize visual selection at (0,0)
                        focusCoord(cur);

                        // Handle key navigation
                        document.addEventListener('keydown', (ev) => {
                            const arrows = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown'];
                            if (!arrows.includes(ev.key)) return;

                            // If an input inside our left-column controls is focused
                            // (search input or the switch inputs), treat horizontal
                            // arrow presses as navigation away from the control rather
                            // than letting caret/toggle behavior consume them.
                            try {
                                const active = document.activeElement;
                                if (active) {
                                    // search input
                                    if (active === searchInput && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
                                        ev.preventDefault();
                                        try { active.blur(); } catch (e) {}
                                        // ensure our grid coord matches the search box
                                        cur = {r:0,c:0};
                                    }
                                    // buydowns/alternatives inner inputs
                                    else if (active.closest && active.closest('.buydowns-switch') && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
                                        ev.preventDefault();
                                        try { active.blur(); } catch (e) {}
                                        cur = {r:1,c:2};
                                    } else if (active.closest && active.closest('.alternatives-switch') && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
                                        ev.preventDefault();
                                        try { active.blur(); } catch (e) {}
                                        cur = {r:2,c:2};
                                    }
                                }
                            } catch (e) {
                                // ignore
                            }
                            // If we're in the right-column list, handle navigation there
                            if (inRightList) {
                                ev.preventDefault();
                                const allButtons = Array.from(container.querySelectorAll('.circle-btn'))
                                    .filter(b => b.offsetParent !== null && getComputedStyle(b).display !== 'none');
                                if (!allButtons.length) return;

                                // Helper: build spatial rows by Y position (tolerance-based)
                                function buildRows(buttons) {
                                    const rows = [];
                                    const TOL = 8; // px tolerance for grouping
                                    buttons.forEach(b => {
                                        const r = b.getBoundingClientRect();
                                        const top = Math.round(r.top);
                                        let found = false;
                                        for (const row of rows) {
                                            if (Math.abs(row.top - top) <= TOL) {
                                                row.items.push(b);
                                                // average the row top for stability
                                                row.top = Math.round((row.top + top) / 2);
                                                found = true;
                                                break;
                                            }
                                        }
                                        if (!found) rows.push({top: top, items: [b]});
                                    });
                                    // sort rows top->bottom and each row left->right
                                    rows.sort((a,b) => a.top - b.top);
                                    rows.forEach(r => r.items.sort((a,b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left));
                                    return rows;
                                }

                                const rows = buildRows(allButtons);

                                // helper: get index of row containing element
                                function findRowIndex(el) {
                                    for (let i=0;i<rows.length;i++) if (rows[i].items.indexOf(el) !== -1) return i;
                                    return -1;
                                }

                                // helper: pick nearest element in a row to a given centerX
                                function nearestInRow(rowIdx, centerX) {
                                    const items = rows[rowIdx].items;
                                    if (!items || items.length === 0) return null;
                                    let best = items[0];
                                    let bestDist = Math.abs((best.getBoundingClientRect().left + best.getBoundingClientRect().right)/2 - centerX);
                                    for (let j=1;j<items.length;j++) {
                                        const it = items[j];
                                        const rect = it.getBoundingClientRect();
                                        const cx = (rect.left + rect.right)/2;
                                        const d = Math.abs(cx - centerX);
                                        if (d < bestDist) { bestDist = d; best = it; }
                                    }
                                    return best;
                                }

                                // helper: nearest grid row anchor (0,1,2) by Y
                                function nearestGridRowByY(centerY) {
                                    const anchors = [];
                                    if (searchInput) anchors.push({el: searchInput, r:0});
                                    if (noSpellBtn) anchors.push({el: noSpellBtn, r:1});
                                    const specialContainer = document.getElementById('special-buttons');
                                    if (specialContainer) anchors.push({el: specialContainer, r:2});
                                    let bestR = 0; let bestD = Infinity;
                                    anchors.forEach(a => {
                                        const rect = a.el.getBoundingClientRect();
                                        const cy = (rect.top + rect.bottom)/2;
                                        const d = Math.abs(cy - centerY);
                                        if (d < bestD) { bestD = d; bestR = a.r; }
                                    });
                                    return bestR;
                                }

                                // helper: find container index (circle-buttons) for current selection
                                function findContainerIndexForEl(el) {
                                    const containers = Array.from(container.querySelectorAll('.circle-buttons'))
                                        .filter(c => c.offsetParent !== null && getComputedStyle(c).display !== 'none');
                                    for (let i=0;i<containers.length;i++) {
                                        if (containers[i].contains(el)) return {containers, idx:i};
                                    }
                                    return {containers, idx:-1};
                                }

                                // current target element
                                const curEl = rightSelectedEl || allButtons[0];
                                const curRect = curEl.getBoundingClientRect();
                                const curCX = (curRect.left + curRect.right)/2;
                                const curCY = (curRect.top + curRect.bottom)/2;

                                // Handle PageUp/PageDown: move to first option in previous/next circle
                                if (ev.key === 'PageUp' || ev.key === 'PageDown') {
                                    const {containers, idx} = findContainerIndexForEl(curEl);
                                    if (!containers.length) return;
                                    const dir = ev.key === 'PageDown' ? 1 : -1;
                                    let nextIdx = idx === -1 ? 0 : (idx + dir + containers.length) % containers.length;
                                    const targetContainer = containers[nextIdx];
                                    // pick the first visible .circle-btn in DOM order
                                    const buttons = Array.from(targetContainer.querySelectorAll('.circle-btn')).filter(b => b.offsetParent !== null && getComputedStyle(b).display !== 'none');
                                    if (!buttons.length) return;
                                    const pick = buttons[0];
                                    clearSelectionVisuals();
                                    rightSelectedEl = pick;
                                    applySelectionVisual(pick);
                                    try { pick.focus(); } catch (e) {}
                                    return;
                                }

                                // Find current row and index
                                let rowIdx = findRowIndex(curEl);
                                if (rowIdx === -1) {
                                    // If the element isn't in any clustered row (rare), rebuild rows and pick first
                                    rowIdx = 0;
                                }

                                // Left/Right movement within the same row
                                if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
                                    const items = rows[rowIdx].items;
                                    const idx = items.indexOf(curEl);
                                    const dir = ev.key === 'ArrowRight' ? 1 : -1;
                                    const newIdx = idx + dir;
                                    if (newIdx >= 0 && newIdx < items.length) {
                                        const newEl = items[newIdx];
                                        clearSelectionVisuals();
                                        rightSelectedEl = newEl;
                                        applySelectionVisual(newEl);
                                        try { newEl.focus(); } catch (e) {}
                                        return;
                                    }

                                    // moved off the list horizontally: map to left/right side of 3x3 grid
                                    const firstVisibleRect = items[0].getBoundingClientRect();
                                    const centerY = (firstVisibleRect.top + firstVisibleRect.bottom)/2;
                                    const targetGridRow = nearestGridRowByY(curCY);
                                    // If moved off right side, land on left side of grid (c=0)
                                    if (ev.key === 'ArrowRight') {
                                        // remember the row we were on before leaving
                                        rememberedRightRow = rowIdx >= 0 ? rowIdx : rememberedRightRow;
                                        inRightList = false;
                                        cur = {r: targetGridRow, c: 0};
                                        rightSelectedEl = null;
                                        focusCoord(cur);
                                        return;
                                    }
                                    // If moved off left side, land on right side of grid (c=2)
                                    if (ev.key === 'ArrowLeft') {
                                        // remember the row we were on before leaving
                                        rememberedRightRow = rowIdx >= 0 ? rowIdx : rememberedRightRow;
                                        inRightList = false;
                                        cur = {r: targetGridRow, c: 2};
                                        rightSelectedEl = null;
                                        focusCoord(cur);
                                        return;
                                    }
                                }

                                // Up/Down move between rows (wrap)
                                if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
                                    const dir = ev.key === 'ArrowDown' ? 1 : -1;
                                    const nextRow = (rowIdx + dir + rows.length) % rows.length;
                                    // pick element in nextRow nearest to current centerX
                                    const pick = nearestInRow(nextRow, curCX) || rows[nextRow].items[0];
                                    if (pick) {
                                        clearSelectionVisuals();
                                        rightSelectedEl = pick;
                                        applySelectionVisual(pick);
                                        try { pick.focus(); } catch (e) {}
                                    }
                                    return;
                                }

                                // Fallback: do nothing
                                return;
                            }

                            ev.preventDefault();

                            let attempted = {r:cur.r, c:cur.c};
                            let dir = null;
                            if (ev.key === 'ArrowUp') { attempted.r = mod3(cur.r - 1); dir = 'vertical'; }
                            if (ev.key === 'ArrowDown') { attempted.r = mod3(cur.r + 1); dir = 'vertical'; }
                            if (ev.key === 'ArrowLeft') { attempted.c = mod3(cur.c - 1); dir = 'horizontal'; }
                            if (ev.key === 'ArrowRight') { attempted.c = mod3(cur.c + 1); dir = 'horizontal'; }

                            // If the user attempted to move horizontally off either side
                            // of the 3x3 grid, or from certain special cells when
                            // corresponding controls are hidden, jump into the
                            // right-column spell list.
                            // Default off-left: at leftmost column and press Left
                            let movingOffLeft = dir === 'horizontal' && ev.key === 'ArrowLeft' && cur.c === 0;
                            // Default off-right: at rightmost column and press Right
                            let movingOffRight = dir === 'horizontal' && ev.key === 'ArrowRight' && cur.c === 2;

                            // Special case: pressing Right from the search field (0,0)
                            // should behave as moving off horizontally to the right.
                            if (dir === 'horizontal' && ev.key === 'ArrowRight' && cur.r === 0 && cur.c === 0) {
                                movingOffRight = true;
                            }

                            // Special case: pressing Right from No Spell (1,0) when the
                            // Buydowns control is absent/hidden should act as moving off
                            // to the right (so we jump into the right-column list).
                            if (dir === 'horizontal' && ev.key === 'ArrowRight' && cur.r === 1 && cur.c === 0) {
                                if (!topBuydowns || topBuydowns.style.display === 'none') movingOffRight = true;
                            }

                            // Special case: pressing Left from the Alternatives cell
                            // (2,2) when the special buttons (Regional/Alchemy) are
                            // hidden should behave as moving off to the left.
                            const altOn = !!(alternativesToggle && alternativesToggle.checked);
                            if (dir === 'horizontal' && ev.key === 'ArrowLeft' && cur.r === 2 && cur.c === 2 && !altOn) {
                                movingOffLeft = true;
                            }
                            if (movingOffLeft || movingOffRight) {
                                const rightButtonsAll = Array.from(container.querySelectorAll('.circle-btn'))
                                    .filter(b => b.offsetParent !== null && getComputedStyle(b).display !== 'none');
                                if (rightButtonsAll.length) {
                                    // cluster into rows by Y so we can pick leftmost/rightmost in a row
                                    const TOL = 8;
                                    const rows = [];
                                    rightButtonsAll.forEach(b => {
                                        const r = b.getBoundingClientRect();
                                        const top = Math.round(r.top);
                                        let found = false;
                                        for (const row of rows) {
                                            if (Math.abs(row.top - top) <= TOL) { row.items.push(b); row.top = Math.round((row.top + top)/2); found = true; break; }
                                        }
                                        if (!found) rows.push({top: top, items: [b]});
                                    });
                                    rows.sort((a,b) => a.top - b.top);
                                    rows.forEach(r => r.items.sort((a,b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left));

                                    // choose target row: remember previous row if available, else find nearest
                                    let targetRowIdx = 0;
                                    if (rememberedRightRow !== null && rememberedRightRow >= 0 && rememberedRightRow < rows.length) {
                                        targetRowIdx = rememberedRightRow;
                                    } else {
                                        // find row nearest to the current grid row y position
                                        const centerY = (() => {
                                            // approximate using anchors
                                            const anchors = [];
                                            if (searchInput) anchors.push(searchInput.getBoundingClientRect());
                                            if (noSpellBtn) anchors.push(noSpellBtn.getBoundingClientRect());
                                            const specialContainer = document.getElementById('special-buttons');
                                            if (specialContainer) anchors.push(specialContainer.getBoundingClientRect());
                                            if (!anchors.length) return rows[0].items[0].getBoundingClientRect().top;
                                            const idx = Math.min(Math.max(cur.r,0), anchors.length-1);
                                            const rect = anchors[idx];
                                            return (rect.top + rect.bottom)/2;
                                        })();
                                        let bestD = Infinity;
                                        for (let i=0;i<rows.length;i++) {
                                            const r = rows[i];
                                            const rect = r.items[0].getBoundingClientRect();
                                            const cy = (rect.top + rect.bottom)/2;
                                            const d = Math.abs(cy - centerY);
                                            if (d < bestD) { bestD = d; targetRowIdx = i; }
                                        }
                                    }

                                    // pick leftmost if we moved off the right side of the grid,
                                    // or pick rightmost if we moved off the left side
                                    const targetItems = rows[targetRowIdx].items;
                                    let pick = null;
                                    if (movingOffRight) pick = targetItems[0];
                                    else if (movingOffLeft) pick = targetItems[targetItems.length-1];

                                    if (!pick) pick = rightButtonsAll[0];

                                    prevGridCur = {r: cur.r, c: cur.c};
                                    inRightList = true;
                                    rightSelectedEl = pick;
                                    clearSelectionVisuals();
                                    applySelectionVisual(pick);
                                    try { pick.focus(); } catch (e) {}
                                    return;
                                }
                            }

                            const final = normalizeCoord(cur, attempted, dir);
                            lastDir = dir;
                            cur = final;
                            focusCoord(cur);
                        });
                        
                        // Hover-to-select: respond to mouse movement over interactive elements
                        (function setupHoverToSelect() {
                            let lastHovered = null;
                            document.addEventListener('mousemove', (ev) => {
                                try {
                                    const active = document.activeElement;
                                    const tag = (active && active.tagName) || '';
                                    // Allow hover-to-select when the search input is focused
                                    // but ignore when typing into other inputs like textareas/selects.
                                    if (tag === 'TEXTAREA' || tag === 'SELECT') return;
                                    if (tag === 'INPUT' && active !== searchInput) return;

                                    const hovered = ev.target.closest('.circle-btn, .buydowns-switch, .alternatives-switch, #search-input, #no-spell-btn, #regional-btn, #alchemy-btn');
                                    if (!hovered) { lastHovered = null; return; }
                                    if (hovered === lastHovered) return;
                                    lastHovered = hovered;

                                    // Ignore the visual-only alchemy label when hovered
                                    if (hovered.id === 'alchemy-points') return;

                                    // If hover is on a switch container. Check Alternatives first
                                    // because the Alternatives element also includes the
                                    // 'buydowns-switch' class in the markup.
                                    if (hovered.classList && (hovered.classList.contains('alternatives-switch') || hovered.classList.contains('buydowns-switch'))) {
                                        // Focus the corresponding left-column coordinate
                                        inRightList = false;
                                        if (hovered.classList.contains('alternatives-switch')) {
                                            cur = {r:2, c:2};
                                        } else {
                                            cur = {r:1, c:2};
                                        }
                                        rightSelectedEl = null;
                                        focusCoord(cur);
                                        return;
                                    }

                                    // Search input and left-column buttons
                                    if (hovered.id === 'search-input') { inRightList = false; cur = {r:0,c:0}; rightSelectedEl = null; focusCoord(cur); return; }
                                    if (hovered.id === 'no-spell-btn') { inRightList = false; cur = {r:1,c:0}; rightSelectedEl = null; focusCoord(cur); return; }
                                    if (hovered.id === 'regional-btn') { inRightList = false; cur = {r:2,c:0}; rightSelectedEl = null; focusCoord(cur); return; }
                                    if (hovered.id === 'alchemy-btn') { inRightList = false; cur = {r:2,c:1}; rightSelectedEl = null; focusCoord(cur); return; }

                                    // If hovered is a right-column option (.circle-btn)
                                    if (hovered.classList && hovered.classList.contains('circle-btn')) {
                                        // Mark we're in the right list and select the hovered element
                                        inRightList = true;
                                        rightSelectedEl = hovered;

                                        // Build rows to find the hovered row index and remember it
                                        const allButtons = Array.from(container.querySelectorAll('.circle-btn'))
                                            .filter(b => b.offsetParent !== null && getComputedStyle(b).display !== 'none');
                                        const rows = [];
                                        const TOL = 8;
                                        allButtons.forEach(b => {
                                            const r = b.getBoundingClientRect();
                                            const top = Math.round(r.top);
                                            let found = false;
                                            for (const row of rows) {
                                                if (Math.abs(row.top - top) <= TOL) { row.items.push(b); row.top = Math.round((row.top + top)/2); found = true; break; }
                                            }
                                            if (!found) rows.push({top: top, items: [b]});
                                        });
                                        rows.sort((a,b) => a.top - b.top);
                                        rows.forEach(r => r.items.sort((a,b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left));
                                        // find hovered row index
                                        for (let i=0;i<rows.length;i++) {
                                            if (rows[i].items.indexOf(hovered) !== -1) { rememberedRightRow = i; break; }
                                        }

                                        clearSelectionVisuals();
                                        applySelectionVisual(hovered);
                                        try { hovered.focus(); } catch (e) {}
                                    }
                                } catch (e) {
                                    // ignore hover errors
                                }
                            }, { passive: true });
                        })();

                        // Activation via Enter/Space
                        document.addEventListener('keydown', (ev) => {
                            if (ev.key !== 'Enter' && ev.key !== ' ') return;
                            // If the search input is focused, allow Space to be typed
                            try {
                                const active = document.activeElement;
                                if (ev.key === ' ' && active && active === searchInput) {
                                    // Let the browser insert a space into the search box
                                    return;
                                }
                            } catch (e) {}
                            ev.preventDefault();
                            // Prefer the element represented by the current grid coord
                            // but if we're navigating the right-column list, prefer the
                            // right-selected element so Space/Enter activate it.
                            let el = null;
                            if (inRightList && rightSelectedEl) {
                                el = rightSelectedEl;
                            } else {
                                el = elementForCoord(cur);
                                // If no grid element (we might be in the right-column list),
                                // try the selected right-column element or the active element
                                if (!el) {
                                    el = rightSelectedEl || document.querySelector('.circle-btn.kbd-selected') || (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('circle-btn') ? document.activeElement : null);
                                }
                            }
                            if (!el) return;

                            // If a switch container, toggle the nested checkbox
                            if (el.classList && (el.classList.contains('buydowns-switch') || el.classList.contains('alternatives-switch'))) {
                                const input = el.querySelector('input');
                                if (input) {
                                    input.checked = !input.checked;
                                    input.dispatchEvent(new Event('change', {bubbles:true}));
                                }
                                return;
                            }
                            // If input (search), focus
                            if (el.tagName === 'INPUT') {
                                el.focus();
                                return;
                            }
                            // If button, click
                            if (el.classList && el.classList.contains('circle-btn')) {
                                try { el.click(); } catch (e) {}
                                return;
                            }
                        });

                    // Escape key: return to index page
                    document.addEventListener('keydown', (ev) => {
                        if (ev.key === 'Escape' || ev.key === 'Esc') {
                            ev.preventDefault();
                            window.location.href = '../index.html';
                        }
                    });
                    })();

            // When a circle button is clicked, navigate back to index and pass the selection
            container.addEventListener('click', (ev) => {
                const btn = ev.target.closest('.circle-btn');
                if (!btn) return;

                const label = btn.textContent || btn.innerText;
                // selectedPosition is captured from above (string like '3-2')
                const pos = selectedPosition;
                if (!pos) return;

                try {
                    // Persist into a shared 'spells' map in localStorage
                    const raw = localStorage.getItem('spells');
                    const map = raw ? JSON.parse(raw) : {};
                    map[pos] = label;
                    localStorage.setItem('spells', JSON.stringify(map));
                    // Also store selectedPosition for convenience
                    localStorage.setItem('selectedPosition', pos);
                } catch (e) {
                    // ignore
                }

                const goto = `../index.html?pos=${encodeURIComponent(pos)}&spell=${encodeURIComponent(label)}`;
                window.location.href = goto;
            });

            // Wire up the No Spell button to clear the selected slot and return to index
            if (noSpellBtn) {
                noSpellBtn.addEventListener('click', () => {
                    const pos = selectedPosition;
                    if (!pos) return;

                    try {
                        const raw = localStorage.getItem('spells');
                        const map = raw ? JSON.parse(raw) : {};
                        if (map.hasOwnProperty(pos)) {
                            delete map[pos];
                            localStorage.setItem('spells', JSON.stringify(map));
                        }
                        // also clear selectedPosition
                        localStorage.removeItem('selectedPosition');
                    } catch (e) {
                        // ignore
                    }

                    // Return to index; instruct index to clear this specific position
                    window.location.href = `../index.html?clearedPos=${encodeURIComponent(pos)}`;
                });
            }

            // Wire up the Regional and Alchemy buttons so they behave like spell options.
            // Save the button's displayed text (this ensures Alchemy's "(n)" suffix
            // is preserved when the selection is stored and the index page is shown).
            function makeSpecialBtnHandler(btn) {
                if (!btn) return;
                btn.addEventListener('click', () => {
                    const pos = selectedPosition;
                    if (!pos) return;

                    // Use the button's visible label so dynamic labels (e.g. "Alchemy (8)")
                    // are persisted exactly as shown.
                    const label = (btn.textContent || btn.innerText || '').trim();

                    try {
                        // Persist into the shared 'spells' map and store selectedPosition
                        const raw = localStorage.getItem('spells');
                        const map = raw ? JSON.parse(raw) : {};
                        map[pos] = label;
                        localStorage.setItem('spells', JSON.stringify(map));
                        localStorage.setItem('selectedPosition', pos);
                    } catch (e) {
                        // ignore
                    }

                    const goto = `../index.html?pos=${encodeURIComponent(pos)}&spell=${encodeURIComponent(label)}`;
                    window.location.href = goto;
                });
            }

            makeSpecialBtnHandler(regionalBtn);
            makeSpecialBtnHandler(alchemyBtn);
        });
    </script>
</body>
