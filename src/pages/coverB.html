<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cover B</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .hf-container{max-width:880px;margin:0.75rem auto;padding:0.75rem 1.25rem;font-family:system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif}
    .row{display:flex;gap:0.5rem;align-items:center}
    .names{display:flex;align-items:center;gap:0.75rem;font-size:1rem;margin-bottom:1rem}
    .names input{font-size:1rem;padding:0.45rem 0.6rem}
    .separator{padding:0 0.5rem;color:#666}
    .controls{display:flex;gap:1.25rem;align-items:flex-start}
    .col{background:#f9f9f9;padding:0.75rem;border-radius:6px}
    .col h3{margin:0 0 0.5rem 0}
    .toggle-group{display:flex;gap:0.5rem}
    .toggle-btn{padding:0.45rem 0.75rem;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer}
    /* Use site highlight for toggle active background, but keep text black for readability */
    .toggle-btn.active{background:var(--highlight-color);color:#000;border-color:var(--highlight-color)}
    /* Button styles matching selection/ spelllist pages */
    .circle-btn{padding:0.45rem 0.75rem;border-radius:6px;border:1px solid #ccc;background:#fbfbfb;cursor:pointer;font-size:0.95rem}
    .circle-btn:focus{outline:none}
    /* Keyboard-selected buttons show a bold black border. */
    .circle-btn.kbd-selected {
      color: var(--highlight-color);
      border: 2px solid #000 !important; /* bold black border when navigated by keyboard */
      box-shadow: none !important;
      outline: none !important;
    }

    /* Active (clicked) buttons keep the highlight color but do not get the black border. */
    .circle-btn.active {
      color: var(--highlight-color);
      border: 1px solid var(--highlight-color);
      box-shadow: none !important;
      outline: none !important;
    }

    /* Ensure toggle buttons that also use .circle-btn keep black text when active, and use green border. */
    .toggle-btn.circle-btn.active { color: #000; border: 1px solid var(--highlight-color); }

    /* Remove default focus ring/shadow for interactive items to avoid blue outline; do not change border color here. */
    .circle-btn:focus, .toggle-btn:focus, input[type="radio"]:focus, input[type="checkbox"]:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    /* Change native radio/checkbox accent color to match site green */
    input[type="radio"], input[type="checkbox"] { accent-color: var(--highlight-color); }
    /* Keyboard-selected radios/checkboxes show bold black outline similar to buttons */
    /* When a radio or checkbox is keyboard-selected, show a clear black outline
       around the control itself (not the label). Use outline so we don't affect layout. */
    input[type="radio"].kbd-selected,
    input[type="checkbox"].kbd-selected {
      outline: 2px solid #000 !important;
      outline-offset: 3px;
      box-shadow: none !important;
      border-radius: 4px;
      background-clip: padding-box;
    }
    /* Do not apply borders to labels; we only mark the input element. */
    /* keep label.kbd-selected harmless */
    label.kbd-selected { display: inline-block; }
    .radio-row{display:flex;gap:0.5rem}
    .weapon-line{margin-top:0.5rem;font-weight:600}
    .armor-toggle{display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem}
    .muted{color:#666}
  </style>
</head>
<body>
    <nav class="top-nav">
      <a class="nav-btn" href="coverB.html">Spellcaster Info</a>
      <a class="nav-btn" href="spelllistB.html">Spell List</a>
      <a class="nav-btn" href="index.html" style="margin-left:auto;">Restart</a>
    </nav>
  <main class="hf-container">
    <div class="names">
      <input id="ic-name" type="text" placeholder="IC Name" aria-label="IC Name" />
      <span class="separator">|</span>
      <input id="ooc-name" type="text" placeholder="OOC Name" aria-label="OOC Name" />
    </div>

    <div class="controls">
      <div class="col" style="flex:1;min-width:0">
        <h3>Spellbook</h3>
        <div class="toggle-group" role="tablist" aria-label="Spellbook">
          <button id="toggle-ooc" class="toggle-btn circle-btn" aria-pressed="true">OOC Spellbook</button>
          <button id="toggle-ic" class="toggle-btn circle-btn">IC Spellbook</button>
        </div>

        <h3 style="margin-top:1rem">Path</h3>
        <div class="radio-row" role="radiogroup" aria-label="Path selection">
          <label><input type="radio" name="path" value="1" checked /> 1-Path</label>
          <label><input type="radio" name="path" value="2" /> 2-Path</label>
          <label><input type="radio" name="path" value="3" /> 3-Path</label>
        </div>

        <div class="weapon-line">Weapon Restriction: <span id="weapon-restriction">Light</span></div>

        <div class="armor-toggle">
          <label for="armor"><input id="armor" type="checkbox" /> Armor</label>
          <span id="armor-note" class="muted"></span>
        </div>
      </div>

      <!-- Preview removed per request -->
    </div>

    <div style="margin-top:1rem">
      <a href="spelllistB.html"><button class="circle-btn" type="button">Spell List</button></a>
    </div>
  </main>

  <script>
    (function(){
      var btnOoc = document.getElementById('toggle-ooc');
      var btnIc = document.getElementById('toggle-ic');
      var icInput = document.getElementById('ic-name');
      var oocInput = document.getElementById('ooc-name');
      var armorCheckbox = document.getElementById('armor');
      var armorNote = document.getElementById('armor-note');
      var weaponSpan = document.getElementById('weapon-restriction');
      var lastSelectedPath = '1';
      var armorUserSet = false; // whether user manually toggled armor

      function setActiveSpellbook(isOoc){
        if (isOoc) {
          btnOoc.classList.add('active'); btnOoc.setAttribute('aria-pressed','true');
          btnIc.classList.remove('active'); btnIc.setAttribute('aria-pressed','false');
        } else {
          btnIc.classList.add('active'); btnIc.setAttribute('aria-pressed','true');
          btnOoc.classList.remove('active'); btnOoc.setAttribute('aria-pressed','false');
        }
      }

      btnOoc.addEventListener('click', function(){ setActiveSpellbook(true); saveCover(); });
      btnIc.addEventListener('click', function(){ setActiveSpellbook(false); saveCover(); });

      // Path radios
      var pathRadios = document.querySelectorAll('input[name="path"]');
      function updatePathAndWeapon(){
        var selected = '1';
        for (var i=0;i<pathRadios.length;i++) {
          if (pathRadios[i].checked) { selected = pathRadios[i].value; break; }
        }
        // path preview removed; UI updates weapon restriction below
        var weapon = 'Light';
        if (selected === '1') weapon = 'Light';
        else if (selected === '2') weapon = 'Medial';
        else if (selected === '3') weapon = 'Severe';
        weaponSpan.textContent = weapon;
        // weapon preview removed; update weapon span only

        // Armor toggle: cannot be turned off if 1-Path is selected
        if (selected === '1') {
          armorCheckbox.checked = true;
          armorCheckbox.disabled = true;
          armorNote.textContent = '(Free for 1-Paths)';
        } else {
          // If we're moving away from 1-Path (1 -> 2/3), default to unchecked.
          // If we're switching between 2 and 3, preserve the current armor value.
          if (lastSelectedPath === '1') {
            // If user had manually set armor previously, preserve it; otherwise default to unchecked.
            armorCheckbox.checked = armorUserSet ? true : false;
          }
          armorCheckbox.disabled = false;
          armorNote.textContent = '';
        }
        // remember the last selected path for next change
        lastSelectedPath = selected;
      }
      for (var r=0;r<pathRadios.length;r++) pathRadios[r].addEventListener('change', function(){ updatePathAndWeapon(); saveCover(); });

      // Save handlers: persist to storage when changed
      icInput.addEventListener('input', function(){ saveCover(); });
      oocInput.addEventListener('input', function(){ saveCover(); });
      armorCheckbox.addEventListener('change', function(){
        // When user toggles Armor:
        // - If they unchecked Armor while on path 2 or 3, treat this as a deliberate
        //   deselect and clear the 'user set' flag so future defaults do not force it on.
        // - If they checked Armor (or toggled on path 1 which is forced), treat as user-set.
        var selectedPath = '1';
        for (var i=0;i<pathRadios.length;i++) { if (pathRadios[i].checked) { selectedPath = pathRadios[i].value; break; } }

        if (!armorCheckbox.checked && (selectedPath === '2' || selectedPath === '3')) {
          // user deliberately turned armor off on 2/3 -> clear the user-set flag
          armorUserSet = false;
        } else {
          // checking armor or toggling while forced -> treat as user-set.
          armorUserSet = true;
        }

        saveCover();
      });

      // Storage helpers
      function setCoverItem(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} try{ localStorage.setItem(k, v); }catch(e){} }
      function getCoverItem(k){ try{ var v = sessionStorage.getItem(k); if (v !== null) return v; }catch(e){} try{ var w = localStorage.getItem(k); if (w !== null) return w; }catch(e){} return null; }

      function saveCover(){
        try{
          setCoverItem('cover_icName', icInput.value || '');
          setCoverItem('cover_oocName', oocInput.value || '');
          // spellbook: 'OOC' or 'IC'
          var sb = btnOoc.classList.contains('active') ? 'OOC' : 'IC';
          setCoverItem('cover_spellbook', sb);
          // path
          var sel = '1'; for (var i=0;i<pathRadios.length;i++) if (pathRadios[i].checked) { sel = pathRadios[i].value; break; }
          setCoverItem('cover_path', sel);
          // armor
          setCoverItem('cover_armor', armorCheckbox.checked ? '1' : '0');
          // whether armor was manually set by the user
          setCoverItem('cover_armor_user', armorUserSet ? '1' : '0');
        }catch(e){}
      }

      function restoreCover(){
        try{
          var ic = getCoverItem('cover_icName'); if (ic !== null) icInput.value = ic;
          var ooc = getCoverItem('cover_oocName'); if (ooc !== null) oocInput.value = ooc;
          var sb = getCoverItem('cover_spellbook'); if (sb === 'IC') setActiveSpellbook(false); else setActiveSpellbook(true);
          var p = getCoverItem('cover_path'); if (p) {
            for (var i=0;i<pathRadios.length;i++){ if (pathRadios[i].value === p) pathRadios[i].checked = true; }
            lastSelectedPath = p;
          }
          var ar = getCoverItem('cover_armor'); if (ar !== null) armorCheckbox.checked = (ar === '1');
          var au = getCoverItem('cover_armor_user'); if (au !== null) armorUserSet = (au === '1');
        }catch(e){}
      }

      // Initialize default state and restore saved values
      setActiveSpellbook(true);
      // Ensure armor default: checked
      armorCheckbox.checked = true;
      // Restore from storage (if any) before applying path behavior
      restoreCover();
      updatePathAndWeapon();

      // --- Keyboard navigation (3x5 grid) -----------------------------
      // Grid layout (rows 0..4, cols 0..2)
      // row 0: (0,0)=ic-name, (0,1)=ooc-name, (0,2)=redirects
      // row 1: (1,0)=toggle-ooc, (1,1)=toggle-ic, (1,2)=redirects
      // row 2: (2,0)=path1, (2,1)=path2, (2,2)=path3
      // row 3: (3,0)=armor, (3,1) & (3,2)=redirect to (3,0)
      // row 4: (4,0)=spelllist button, (4,1)/(4,2)=redirect to (4,0)
      var gridRows = 5, gridCols = 3;
      var curR = 0, curC = 0; // start on IC Name by default

      var grid = [
        [ icInput, oocInput, null ],
        [ btnOoc, btnIc, null ],
        [ document.querySelector('input[name="path"][value="1"]'), document.querySelector('input[name="path"][value="2"]'), document.querySelector('input[name="path"][value="3"]') ],
        [ armorCheckbox, null, null ],
        [ document.querySelector('a[href="spelllistB.html"] .circle-btn'), null, null ]
      ];

      function resolveCell(r, c, dir) {
        // wrap rows and cols
        if (r < 0) r = gridRows - 1;
        if (r >= gridRows) r = 0;
        if (c < 0) c = gridCols - 1;
        if (c >= gridCols) c = 0;

        var el = grid[r][c];
        if (el) return { r: r, c: c, el: el };

        // handle redirects for null cells
        if (dir === 'up' || dir === 'down') {
          // redirect to center column
          return { r: r, c: 1, el: grid[r][1] };
        }
        if (dir === 'left') {
          return { r: r, c: 0, el: grid[r][0] };
        }
        // right
        return { r: r, c: 1, el: grid[r][1] };
      }

      function clearKbdSelected() {
        var prev = document.querySelectorAll('.kbd-selected');
        prev.forEach(function(n){ n.classList.remove('kbd-selected'); });
      }

      function focusCell(r, c) {
        var res = resolveCell(r, c, null);
        if (!res || !res.el) return;
        curR = res.r; curC = res.c;
        clearKbdSelected();
        try { res.el.focus(); } catch(e) {}
        // visually mark buttons/controls that use circle-btn
        if (res.el.classList && res.el.classList.contains('circle-btn')) res.el.classList.add('kbd-selected');
        // For inputs, also add kbd-selected to the input and to its parent label (if present)
        if (res.el.tagName && (res.el.tagName.toLowerCase() === 'input')) {
          try {
            // Mark only the input itself as keyboard-selected; do not add styling to the label.
            res.el.classList.add('kbd-selected');
          } catch(e) {}
        }
      }

      // Initialize focus state: start at IC Name
      curR = 0; curC = 0;
      // Focus the starting cell but don't steal keyboard focus until user presses arrow
      focusCell(curR, curC);

      // --- Pause handling for metrics: do not count time spent on this cover page ---
      function readPauseAccum() {
        try { var v = sessionStorage.getItem('pauseAccumMs'); if (v !== null) return parseInt(v,10)||0; } catch(e){}
        try { var w = localStorage.getItem('pauseAccumMs'); if (w !== null) return parseInt(w,10)||0; } catch(e){}
        return 0;
      }
      function writePauseAccum(n) {
        try { sessionStorage.setItem('pauseAccumMs', String(n)); } catch(e) {}
        try { localStorage.setItem('pauseAccumMs', String(n)); } catch(e) {}
      }
      function startPauseNow() {
        try { var now = String(Date.now()); sessionStorage.setItem('pauseStart', now); } catch(e){}
        try { var now2 = String(Date.now()); localStorage.setItem('pauseStart', now2); } catch(e){}
      }
      function endPauseNow() {
        try {
          var ps = sessionStorage.getItem('pauseStart');
          if (!ps) ps = localStorage.getItem('pauseStart');
          if (ps) {
            var delta = Date.now() - parseInt(ps,10);
            if (!isFinite(delta) || delta < 0) delta = 0;
            var acc = readPauseAccum() || 0;
            acc = acc + delta;
            writePauseAccum(acc);
          }
        } catch(e) {}
        try { sessionStorage.removeItem('pauseStart'); } catch(e){}
        try { localStorage.removeItem('pauseStart'); } catch(e){}
      }

      // Start counting pause on entering Cover so this period won't be added to Total Time
      try { startPauseNow(); } catch(e){}

      // If user navigates away (e.g., clicks Spell List), end the pause before leaving
      Array.from(document.querySelectorAll('a[href]')).forEach(function(a){
        try {
          var href = a.getAttribute('href') || '';
          if (href.indexOf('spelllistB.html') !== -1) {
            a.addEventListener('click', function(){ try { endPauseNow(); } catch(e){} }, {passive:true});
          }
        } catch(e){}
      });

      // As a safety, also end pause on unload (covers other navigation paths)
      window.addEventListener('beforeunload', function(){ try{ endPauseNow(); }catch(e){} });

      document.addEventListener('keydown', function(ev){
        var handled = false;
        var dir = null;
        if (ev.key === 'ArrowUp') { dir = 'up'; handled = true; }
        else if (ev.key === 'ArrowDown') { dir = 'down'; handled = true; }
        else if (ev.key === 'ArrowLeft') { dir = 'left'; handled = true; }
        else if (ev.key === 'ArrowRight') { dir = 'right'; handled = true; }

        if (dir) {
            ev.preventDefault();
            var dr = dir === 'up' ? -1 : dir === 'down' ? 1 : 0;
            var dc = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;

            // Special-case navigation rules:
            // - For rows 0 and 1, pressing Left while in col 0 wraps to col 1,
            //   and pressing Right while in col 1 wraps to col 0.
            // - From row 2, pressing Down normally goes to Armor at (3,0), but
            //   if Armor is disabled (1-Path), skip to row 4 instead.
            var target = null;
            if ((curR === 0 || curR === 1) && dir === 'left' && curC === 0) {
              target = resolveCell(curR, 1, null);
            } else if ((curR === 0 || curR === 1) && dir === 'right' && curC === 1) {
              target = resolveCell(curR, 0, null);
            } else if (dir === 'down' && curR === 2) {
              // moving down from path row -> normally armor
              if (armorCheckbox && armorCheckbox.disabled) {
                // skip armor when disabled -> go to spelllist row
                target = { r: 4, c: 0, el: grid[4][0] };
              } else {
                target = { r: 3, c: 0, el: grid[3][0] };
              }
            } else {
              target = resolveCell(curR + dr, curC + dc, dir);
            }

            // If the resolved target lands on the Armor row but Armor is disabled,
            // redirect based on navigation direction: Down -> skip to row 4, Up -> back to row 2.
            if (target && target.r === 3 && armorCheckbox && armorCheckbox.disabled) {
              if (dir === 'down') {
                target = { r: 4, c: 0, el: grid[4][0] };
              } else if (dir === 'up') {
                // go to the path row in the same column if possible
                var pathCol = (curC >= 0 && curC <= 2) ? curC : 0;
                target = { r: 2, c: pathCol, el: grid[2][pathCol] || grid[2][0] };
              } else {
                // fallback - send to the path row
                target = { r: 2, c: curC, el: grid[2][curC] || grid[2][0] };
              }
            }

            if (target && target.el) focusCell(target.r, target.c);
          return;
        }

        // Activation keys
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          var res = resolveCell(curR, curC, null);
          if (!res || !res.el) return;
          var el = res.el;
          var tag = (el.tagName || '').toLowerCase();
          if (tag === 'button') { el.click(); }
          else if (tag === 'input') {
            var type = (el.type || '').toLowerCase();
            if (type === 'checkbox') { el.checked = !el.checked; el.dispatchEvent(new Event('change')); }
            else if (type === 'radio') { el.checked = true; el.dispatchEvent(new Event('change')); }
            else { try{ el.focus(); }catch(e){} }
          }
          else { try{ el.click(); }catch(e){} }
        }
      });
      // -----------------------------------------------------------------

    })();
  </script>
</body>
</html>
