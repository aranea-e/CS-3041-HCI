<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survey</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .hf-container{max-width:760px;margin:3rem auto;padding:1.25rem;font-family:system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif}
    .hf-cta{display:inline-block;margin-top:1rem}
    .hf-cta button{padding:0.6rem 1rem;font-size:1rem}
  </style>
</head>
<body>
  <main class="hf-container">

    <form id="nps-form" style="margin-top:1rem;">
      <p style="font-weight:600;">How likely would you be to recommend this tool over existing tools?</p>
      <div aria-label="Net Promoter Score" role="group" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;">
        <!-- Render buttons 0..10 -->
        <!-- Each option is a radio so one value is selected; default none selected -->
        <div style="display:flex; gap:0.25rem; flex-wrap:wrap;">
          <!-- generate 0..10 -->
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="0"> 0
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="1"> 1
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="2"> 2
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="3"> 3
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="4"> 4
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="5"> 5
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="6"> 6
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="7"> 7
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="8"> 8
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="9"> 9
          </label>
          <label style="display:inline-flex; align-items:center; gap:0.25rem;">
            <input type="radio" name="nps" value="10"> 10
          </label>
        </div>
      </div>

      <div class="hf-cta" style="margin-top:1rem;">
        <button id="nps-submit" type="button" disabled>Continue to Metrics</button>
      </div>
    </form>

    <script>
      (function(){
        var form = document.getElementById('nps-form');
        var submit = document.getElementById('nps-submit');
        var radios = Array.prototype.slice.call(form.querySelectorAll('input[name="nps"]'));

        function updateState() {
          var checked = form.querySelector('input[name="nps"]:checked');
          submit.disabled = !checked;
        }

        // initialize state
        updateState();

        radios.forEach(function(r){
          r.addEventListener('change', function(){ updateState(); });
        });

        submit.addEventListener('click', function(){
          var val = form.querySelector('input[name="nps"]:checked');
          if (!val) {
            // If somehow clicked while no selection, focus first option and do nothing
            if (radios.length) radios[0].focus();
            return;
          }
          try { sessionStorage.setItem('surveyResponse', String(val.value)); } catch(e) {}
          try { localStorage.setItem('surveyResponse', String(val.value)); } catch(e) {}
          window.location.href = 'end.html';
        });
      })();
    </script>
  </main>
</body>
</html>
